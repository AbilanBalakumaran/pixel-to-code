<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel-to-Code Agent</title>
<meta name="theme-color" content="#0d1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
<header class="top">
  <h1>Pixel&#8209;to&#8209;Code</h1>
  <div class="cfg">
    <input id="apiKey" type="password" placeholder="Clé API Gemini" autocomplete="off" aria-label="Clé API Gemini">
    <select id="model" aria-label="Modèle">
      <option>gemini-2.0-flash</option><option>gemini-1.5-flash</option><option>gemini-2.5-flash</option>
    </select>
  </div>
</header>
<main>
  <section class="card" id="s1">
    <h2>1. Importer</h2>
    <label id="drop" class="drop" tabindex="0">Déposez une image ou touchez pour choisir
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    <button id="sampleBtn" type="button">Essayer avec l'exemple</button>
    <div class="row">
      <label>Supprimer le fond <input id="rmbg" type="checkbox"></label>
      <label>Seuil <input id="tol" type="range" min="5" max="120" value="40"></label>
    </div>
  </section>
  <section class="card" id="s2">
    <h2>2. Vectoriser</h2>
    <div class="row">
      <label>Couleurs <input id="colors" type="range" min="4" max="32" value="14"></label>
      <button id="traceBtn" disabled>Vectoriser</button>
    </div>
    <div class="compare"><div id="rasterBox" class="pane">Image</div><div id="svgBox" class="pane">SVG</div></div>
  </section>
  <section class="card" id="s3">
    <h2>3. Analyser avec Gemini</h2>
    <div class="row"><button id="aiBtn" disabled>Structurer et animer</button><span id="status" role="status"></span></div>
  </section>
  <section class="card" id="s4">
    <h2>4. Visualiser et éditer</h2>
    <div id="stage" class="stage"></div>
    <div class="row">
      <button id="play">Pause</button><button id="reset">Reset</button>
      <label>Vitesse <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label>
    </div>
    <div class="tabs"><button data-t="gsap" class="on">GSAP</button><button data-t="svg">SVG</button></div>
    <textarea id="code" spellcheck="false" aria-label="Code"></textarea>
    <div class="row"><button id="apply">Appliquer</button><button id="exportSvg">Exporter SVG</button><button id="exportHtml">Exporter HTML</button></div>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
